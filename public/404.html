<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Not found — Timelessblur</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0a0a0c; --ink: #f4f3ef; --muted: #6f6e76; --accent: #8ab4ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Space Mono", ui-monospace, monospace;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 2rem;
  }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: clamp(2.4rem, 9vw, 4.5rem); letter-spacing: -0.02em; }
  h1 span { display: inline-block; filter: blur(4px); opacity: 0.8; }
  p { margin-top: 1.5rem; font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  a { display: inline-block; margin-top: 2rem; color: var(--muted); text-decoration: none; font-size: 0.8rem; border-bottom: 1px solid transparent; }
  a:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>not <span>found</span></h1>
    <p>This page drifted away</p>
    <a href="/">← timelessblur.com</a>
  </main>
</body>
</html>
